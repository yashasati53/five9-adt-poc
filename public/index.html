<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five9 ADT CRM SDK Integration Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Portal Header -->
    <header class="crm-header">
        <div class="brand-section">
            <div class="brand-logo">59</div>
            <div>
                <div class="brand-title">Five9 ADT CRM SDK Portal</div>
                <div class="brand-subtitle">Click-to-Dial Integration POC</div>
            </div>
        </div>
    </header>

    <!-- Portal Main Layout -->
    <main class="portal-container">
        <!-- Outside iFrame: Phone Input & Dial Button Only -->
        <section class="dial-panel">
            <div class="panel-header">
                <h2>CRM Dial Control</h2>
                <p>Sends Click-to-Dial request to Five9 ADT via CRM SDK</p>
            </div>

            <div class="form-group">
                <label for="phoneNumberInput" class="form-label">Phone Number</label>
                <input type="tel" id="phoneNumberInput" class="phone-input" placeholder="Enter phone number (e.g. 15552345678)" value="15552345678">
            </div>

            <button id="dialBtn" class="btn-dial">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
                Dial Call
            </button>

            <!-- Status Indicator -->
            <div id="statusLog" class="status-log">
                <span class="status-dot"></span>
                <span id="statusText">CRM SDK Initialized & Ready</span>
            </div>
        </section>

        <!-- Inside iFrame: Five9 ADT Softphone -->
        <section class="iframe-container">
            <div class="iframe-header">
                <span class="five9-dot"></span>
                <span>Five9 Agent Desktop Toolkit (ADT) iFrame</span>
            </div>
            <iframe id="five9-adt-iframe" 
                    src="https://app.five9.com/clients/integrations/adt.main.html?f9crmapi=true" 
                    class="five9-iframe" 
                    allow="microphone; camera; autoplay; clipboard-read; clipboard-write">
            </iframe>
        </section>
    </main>

    <!-- Five9 Official CRM SDK Javascript Library -->
    <script src="js/five9.crm.sdk.js"></script>
    <!-- Five9 CRM SDK Controller Manager -->
    <script src="js/crm-sdk-controller.js"></script>
    <!-- Portal Application Script -->
    <script src="js/app.js"></script>
</body>
</html>
